name: Container image

# Builds the image and pushes it to GitHub Container Registry (ghcr.io).
# Uses the built-in GITHUB_TOKEN — no extra secrets to configure.
#   - push to main        -> ghcr.io/<owner>/<repo>:latest + :main + :sha
#   - tag v1.2.3          -> ghcr.io/<owner>/<repo>:1.2.3 + :1.2
#   - pull request        -> build only (no push), validates the Dockerfile
# Gated on the Tests workflow: the build job waits for pytest to pass, so a
# red suite blocks the image.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # Same-file gate: `needs:` can only reference jobs in THIS workflow, so
  # pytest runs here (cheap: pip + a few seconds) before any Docker build.
  # The standalone tests.yml reports as its own check on PRs/pushes — the
  # small duplicate run is the price of a real build gate.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  build-and-push:
    runs-on: ubuntu-latest
    needs: tests   # must pass pytest first
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pure-Python image, so arm64 builds fine under QEMU emulation —
      # the slowest step (pip install) has no compiled wheels except
      # pydantic-core (prebuilt wheels exist for both platforms).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (GHCR requirement)
      # and derives tags from the git ref.
      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max